# nginx BÊN TRONG container storybook. Đừng nhầm với nginx reverse proxy ở repo
# backend — cái đó đứng trước và chỉ `proxy_pass` vào đây.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Storybook đặt hash vào tên file bundle, nên chúng bất biến và cache được
    # vĩnh viễn. `index.html` và `index.json` (danh mục story) thì KHÔNG: chúng
    # giữ nguyên tên qua mỗi lần deploy, cache lâu là người xem mắc kẹt ở bản cũ
    # trong khi container đã đổi.
    # Khớp theo ĐOẠN HASH chứ không theo đuôi file: Storybook đặt tên kiểu
    # `293.7efddfad.iframe.bundle.js`, tức là còn `.iframe.bundle` chen giữa hash
    # và `.js`, nên một regex kết thúc bằng `\.(js|css)$` ngay sau hash sẽ không
    # khớp gì cả — và hỏng theo kiểu im lặng, chỉ mất cache chứ không ai thấy.
    #
    # Regex PHẢI nằm trong nháy: `{8,}` không nháy thì nginx đọc `{` và `}` là
    # dấu mở/đóng block và chết lúc nạp config với "unknown directive".
    location ~* "\.[0-9a-f]{8,}\.[^/]+$" {
        # Một header duy nhất: `expires 1y` cũng phát ra `Cache-Control` của
        # riêng nó, dùng kèm `add_header` là response mang hai dòng chồng nhau.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Không phải SPA: mỗi story là một query param trên cùng `index.html`, còn
    # `iframe.html` là file thật. `=404` chứ không fallback về index — một
    # đường dẫn sai nên báo sai, đừng trả ra trang chủ với mã 200.
    location / {
        try_files $uri $uri/ =404;
    }
}
