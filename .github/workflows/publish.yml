name: Publish & deploy

on:
  push:
    branches: [main]
    # Bỏ qua file không đi vào image — sửa README không cần build lại.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# `NEXT_PUBLIC_*` bị INLINE vào bundle lúc `next build`, không đọc lúc chạy — nên
# chúng phải có mặt Ở ĐÂY, lúc build, chứ không phải trong `.env` trên VPS. Sửa
# giá trị dưới đây là phải build lại image; restart container không có tác dụng gì.
#
# Chúng là URL công khai, ai mở devtools cũng thấy — để literal thay vì secret là
# cố ý, vì secret sẽ bị Actions che thành `***` trong log và làm mất khả năng đọc
# log build khi domain sai.
env:
  NEXT_PUBLIC_API_BASE_URL: https://api-noalhub.duckdns.org
  NEXT_PUBLIC_WS_URL: https://ws-noalhub.duckdns.org
  # Origin công khai của apps/web. Cần từ khi có blog: `metadataBase`, canonical,
  # OG, sitemap và JSON-LD đều dựng URL tuyệt đối từ nó (docs/blog-plan.md §6.1).
  # Thiếu biến này thì build VẪN XANH nhưng mọi URL tuyệt đối ra `undefined/...`.
  # Admin không đọc tới nó, nhưng truyền cho cả hai để hai job không lệch cấu hình.
  NEXT_PUBLIC_APP_URL: https://noalhub.duckdns.org

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Bắt buộc: GITHUB_TOKEN mặc định không có quyền ghi vào GitHub Packages.
      packages: write

    # Hai app độc lập nhau nên build song song. `fail-fast: false` để một app hỏng
    # không giết build của app kia — biết cả hai cùng lúc thì sửa một lượt.
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]

    steps:
      - uses: actions/checkout@v4

      # buildx cần cho cache GHA ở bước build bên dưới.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token do Actions tự cấp cho từng run, không phải PAT tự tạo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # `github.repository` = `<owner>/noalhub-fe`, nên chuỗi này ra đúng
          # `ghcr.io/<owner>/noalhub-fe-web` và `-admin` như compose bên BE chờ.
          # Tên package phải viết thường — ghcr.io từ chối tag có chữ hoa.
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # Context là GỐC REPO cho cả hai app: pnpm workspace cần lockfile ở gốc
          # + toàn bộ `packages/*` để resolve `workspace:*`.
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          # Cache tách theo app: chung scope thì hai job song song ghi đè nhau và
          # cache gần như luôn miss.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # CD: cả hai image build xong mới deploy. `needs` vừa xếp thứ tự, vừa hủy deploy
  # nếu bất kỳ app nào build đỏ — không bao giờ deploy nửa vời một app.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Chỉ để `docker login` trên VPS kéo được image private.
      packages: read
    # Bấm tay từ tab Actions cũng deploy được, nhưng chỉ từ main.
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production-fe
      cancel-in-progress: false

    steps:
      - name: Pull & up trên VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            # BẮT BUỘC. Không có nó, ssh-action nuốt exit code: `cd` sai đường dẫn
            # thì các lệnh sau vẫn chạy tiếp trong $HOME, compose không thấy file
            # nên không deploy gì, mà job vẫn xanh vì lệnh CUỐI cùng thoát 0 —
            # đúng kịch bản đã làm bản FE đứng im nhiều ngày.
            #
            # Dùng `set -e` chứ KHÔNG dùng input `script_stop` của ssh-action:
            # `script_stop` chèn một đoạn kiểm tra `$?` vào sau TỪNG DÒNG, nên nó
            # cắt đôi mọi khối nhiều dòng (`if`, `for`, `case`) ở dưới và bash chết
            # ngay lúc parse: syntax error near unexpected token `;'.
            set -e

            cd ${{ secrets.DEPLOY_PATH }}
            # Chốt chặn thứ hai: `cd` có thể thành công vào một thư mục đúng tên
            # nhưng rỗng (VPS cài lại, mount chưa gắn).
            test -f docker-compose.prod.yml

            # Ghim đúng commit vừa build. Tag này khớp `type=sha,format=long`.
            TAG=sha-${{ github.sha }}

            # Ghi vào `.env` chứ không `export`: compose đọc `FE_IMAGE_TAG` từ đó,
            # nên deploy của BE sau này (`up -d`) giữ nguyên bản FE đang chạy thay
            # vì tráo về `latest`.
            if grep -q '^FE_IMAGE_TAG=' .env; then
              sed -i "s|^FE_IMAGE_TAG=.*|FE_IMAGE_TAG=$TAG|" .env
            else
              echo "FE_IMAGE_TAG=$TAG" >> .env
            fi

            # Package trên ghcr là private nên `pull` cần đăng nhập. Token của run
            # này hết hạn khi job kết thúc.
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml pull web admin
            # Chỉ `up -d web admin`: app/db/redis/nginx thuộc repo khác, deploy FE
            # không được phép recreate chúng.
            docker compose -f docker-compose.prod.yml up -d web admin

            docker logout ghcr.io

            # BẮT BUỘC, và đây là lý do web/admin từng đổi chỗ cho nhau sau mỗi lần
            # deploy: `proxy_pass http://web:3000` viết thẳng tên, không qua biến và
            # không khai `resolver`, nên nginx phân giải tên đó MỘT LẦN lúc nạp config
            # rồi cache IP vĩnh viễn. `up -d web admin` recreate hai container đó và
            # Docker cấp IP mới, tái sử dụng luôn IP vừa được giải phóng — nhưng nginx
            # không nằm trong danh sách recreate nên vẫn gửi request theo IP cũ đã đổi
            # chủ. Kết quả: noalhub.duckdns.org trả ra app admin và ngược lại, trong
            # khi file config hoàn toàn đúng.
            #
            # `reload` nạp lại config nên phân giải lại toàn bộ tên upstream. Vòng lặp
            # `nginx -s reload` mỗi 6 giờ trong compose cũng tự chữa được, nhưng nó chỉ
            # che lỗi sau vài tiếng chứ không sửa.
            #
            # `-T` vì phiên ssh này không có TTY. `nginx -t` trước để một config hỏng
            # (do repo BE sửa) bị bắt ngay ở đây thay vì làm chết nginx lúc reload.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            # Xác nhận container ĐANG chạy đúng tag vừa build. Health check ở
            # bước sau chỉ gọi domain, mà container cũ còn sống thì vẫn trả 200 —
            # nó không phân biệt được "deploy xong" với "deploy không làm gì".
            for svc in web admin; do
              cid=$(docker compose -f docker-compose.prod.yml ps -q "$svc")
              [ -n "$cid" ] || { echo "$svc không có container nào đang chạy"; exit 1; }
              img=$(docker inspect -f '{{.Config.Image}}' "$cid")
              case "$img" in
                *:"$TAG") echo "$svc → $img OK" ;;
                *) echo "$svc đang chạy $img, mong đợi tag $TAG"; exit 1 ;;
              esac
            done

            # Image cũ tích lại mỗi lần deploy và VPS nhỏ hết đĩa rất nhanh. `-f`
            # chỉ xóa image không container nào tham chiếu.
            docker image prune -f

      - name: Kiểm tra health sau deploy
        # Gọi từ ngoài internet, đi qua đúng đường nginx/TLS mà client thật dùng —
        # bắt được cả lỗi cert lẫn lỗi app, thứ mà healthcheck nội bộ không thấy.
        run: |
          # Chờ tới khi URL trả về đúng mã mong đợi.
          expect() {
            url="$1"; want="$2"
            for i in $(seq 1 10); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" = "$want" ] && echo "$url → $code OK" && return 0
              echo "lần $i: $url → $code (mong đợi $want), thử lại sau 6s"
              sleep 6
            done
            echo "$url không trả $want sau 60s — kiểm tra logs trên VPS"
            return 1
          }

          # Route sống được ngay:
          expect https://noalhub.duckdns.org/ 200
          expect https://admin-noalhub.duckdns.org/login 200

          # Và ĐÚNG app đứng sau mỗi domain. Chỉ kiểm tra 200 là không đủ: khi nginx
          # cache IP upstream cũ, hai domain đổi chỗ cho nhau mà CẢ HAI vẫn trả 200 —
          # deploy xanh trong khi khách vào trang chủ thì thấy trang quản trị. Hai
          # route dưới đây chỉ tồn tại ở đúng một app, nên cặp 200/404 khoá chặt danh
          # tính. Sửa cấu trúc route thì phải sửa cả bốn dòng này.
          expect https://noalhub.duckdns.org/dashboard 200        # chỉ có ở apps/web
          expect https://noalhub.duckdns.org/overview 404         # chỉ có ở apps/admin
          expect https://admin-noalhub.duckdns.org/overview 200
          expect https://admin-noalhub.duckdns.org/dashboard 404
