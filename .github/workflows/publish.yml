name: Publish & deploy

on:
  push:
    branches: [main]
    # Bỏ qua file không đi vào image — sửa README không cần build lại.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# `NEXT_PUBLIC_*` bị INLINE vào bundle lúc `next build`, không đọc lúc chạy — nên
# chúng phải có mặt Ở ĐÂY, lúc build, chứ không phải trong `.env` trên VPS. Sửa
# giá trị dưới đây là phải build lại image; restart container không có tác dụng gì.
#
# Chúng là URL công khai, ai mở devtools cũng thấy — để literal thay vì secret là
# cố ý, vì secret sẽ bị Actions che thành `***` trong log và làm mất khả năng đọc
# log build khi domain sai.
env:
  NEXT_PUBLIC_API_BASE_URL: https://api-noalhub.duckdns.org
  NEXT_PUBLIC_WS_URL: https://ws-noalhub.duckdns.org

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Bắt buộc: GITHUB_TOKEN mặc định không có quyền ghi vào GitHub Packages.
      packages: write

    # Hai app độc lập nhau nên build song song. `fail-fast: false` để một app hỏng
    # không giết build của app kia — biết cả hai cùng lúc thì sửa một lượt.
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]

    steps:
      - uses: actions/checkout@v4

      # buildx cần cho cache GHA ở bước build bên dưới.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token do Actions tự cấp cho từng run, không phải PAT tự tạo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # `github.repository` = `<owner>/noalhub-fe`, nên chuỗi này ra đúng
          # `ghcr.io/<owner>/noalhub-fe-web` và `-admin` như compose bên BE chờ.
          # Tên package phải viết thường — ghcr.io từ chối tag có chữ hoa.
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # Context là GỐC REPO cho cả hai app: pnpm workspace cần lockfile ở gốc
          # + toàn bộ `packages/*` để resolve `workspace:*`.
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
          # Cache tách theo app: chung scope thì hai job song song ghi đè nhau và
          # cache gần như luôn miss.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # CD: cả hai image build xong mới deploy. `needs` vừa xếp thứ tự, vừa hủy deploy
  # nếu bất kỳ app nào build đỏ — không bao giờ deploy nửa vời một app.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Chỉ để `docker login` trên VPS kéo được image private.
      packages: read
    # Bấm tay từ tab Actions cũng deploy được, nhưng chỉ từ main.
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production-fe
      cancel-in-progress: false

    steps:
      - name: Pull & up trên VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Mặc định `sh -e`: một lệnh fail là cả script dừng và job đỏ.
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Ghim đúng commit vừa build. Tag này khớp `type=sha,format=long`.
            TAG=sha-${{ github.sha }}

            # Ghi vào `.env` chứ không `export`: compose đọc `FE_IMAGE_TAG` từ đó,
            # nên deploy của BE sau này (`up -d`) giữ nguyên bản FE đang chạy thay
            # vì tráo về `latest`.
            if grep -q '^FE_IMAGE_TAG=' .env; then
              sed -i "s|^FE_IMAGE_TAG=.*|FE_IMAGE_TAG=$TAG|" .env
            else
              echo "FE_IMAGE_TAG=$TAG" >> .env
            fi

            # Package trên ghcr là private nên `pull` cần đăng nhập. Token của run
            # này hết hạn khi job kết thúc.
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml pull web admin
            # Chỉ `up -d web admin`: app/db/redis/nginx thuộc repo khác, deploy FE
            # không được phép recreate chúng.
            docker compose -f docker-compose.prod.yml up -d web admin

            docker logout ghcr.io
            # Image cũ tích lại mỗi lần deploy và VPS nhỏ hết đĩa rất nhanh. `-f`
            # chỉ xóa image không container nào tham chiếu.
            docker image prune -f

      - name: Kiểm tra health sau deploy
        # Gọi từ ngoài internet, đi qua đúng đường nginx/TLS mà client thật dùng —
        # bắt được cả lỗi cert lẫn lỗi app, thứ mà healthcheck nội bộ không thấy.
        run: |
          check() {
            for i in $(seq 1 10); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$1" || true)
              [ "$code" = "200" ] && echo "$1 OK" && return 0
              echo "lần $i: $1 → $code, thử lại sau 6s"
              sleep 6
            done
            echo "$1 không trả 200 sau 60s — kiểm tra logs trên VPS"
            return 1
          }
          check https://noalhub.duckdns.org/
          check https://admin-noalhub.duckdns.org/login
