name: Publish & deploy

on:
  push:
    branches: [main]
    # Ignore files that never reach the image — editing the README needs no rebuild.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# `NEXT_PUBLIC_*` is INLINED into the bundle at `next build` time, not read at
# runtime — so these have to be HERE, at build time, not in `.env` on the VPS.
# Changing a value below means rebuilding the image; restarting the container does
# nothing.
#
# They are public URLs anyone can see in devtools — keeping them as literals instead
# of secrets is deliberate, because Actions masks secrets as `***` in the logs and
# that makes the build log unreadable when a domain is wrong.
env:
  NEXT_PUBLIC_API_BASE_URL: https://api-noalhub.duckdns.org
  NEXT_PUBLIC_WS_URL: https://ws-noalhub.duckdns.org
  # Public origin of apps/web. Required since the blog landed: `metadataBase`,
  # canonical, OG, sitemap and JSON-LD all build absolute URLs from it
  # (docs/blog.md §6.1). Without it the build STAYS GREEN but every absolute URL
  # comes out as `undefined/...`. Admin never reads it, but both jobs get it so the
  # two configurations do not drift.
  NEXT_PUBLIC_APP_URL: https://noalhub.duckdns.org

jobs:
  # There is no way to set `paths` per job, so the filtering has to be done by a
  # leading job plus an `if:` on the jobs after it. Without it, every Storybook edit
  # rebuilds web and admin from scratch: all three Dockerfiles do `COPY . .` before
  # the build step, so a file changed anywhere busts the layer cache of all three
  # images.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # `shared` deliberately SWEEPS IN all of `packages/**` for all three
            # rather than mapping each package to each app. Filtering too narrowly
            # here produces the worst possible failure: green workflow, green deploy,
            # and a stale image because a build job was wrongly skipped — with no
            # signal to be suspicious about. An extra build only costs a few CI
            # minutes.
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/publish.yml'
            web:
              - *shared
              - 'apps/web/**'
            admin:
              - *shared
              - 'apps/admin/**'
            storybook:
              - *shared
              - 'apps/storybook/**'

  build:
    needs: changes
    # `workflow_dispatch` has no diff to compare, so a manual run builds everything.
    # That is also what you want when you resort to clicking the button: a clean rebuild.
    if: >-
      github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.web == 'true'
      || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required: the default GITHUB_TOKEN cannot write to GitHub Packages.
      packages: write

    # The two apps are independent, so build them in parallel. `fail-fast: false` keeps
    # one broken app from killing the other's build — seeing both at once means fixing
    # them in one pass.
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]

    steps:
      - uses: actions/checkout@v4

      # buildx is needed for the GHA cache in the build step below.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token minted by Actions per run, not a hand-created PAT.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # `github.repository` = `<owner>/noalhub-fe`, so this string resolves to
          # `ghcr.io/<owner>/noalhub-fe-web` and `-admin`, exactly what the BE-side
          # compose expects. Package names must be lowercase — ghcr.io rejects tags
          # with uppercase letters.
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # The context is the REPO ROOT for both apps: the pnpm workspace needs the
          # root lockfile plus all of `packages/*` to resolve `workspace:*`.
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          # Cache scoped per app: sharing a scope makes the two parallel jobs overwrite
          # each other and the cache misses almost every time.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Storybook is kept out of the matrix above: it takes no `NEXT_PUBLIC_*` build args
  # (it builds a static site, nothing to inline), and it is not a precondition for
  # deploying web/admin — the `deploy` job deliberately does NOT `needs` this one; a
  # broken Storybook must never block the other two apps' production release.
  storybook:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # TWO builds from the same Dockerfile: `public` contains none of the
    # `src/internal/**` code (`.storybook/main.ts` drops that glob from the index),
    # while `internal` contains everything and is gated by nginx basic auth. It has to
    # be two images rather than one that filters at runtime: Storybook is a static
    # site, and any story in the bundle is readable by a viewer whether or not the
    # sidebar shows it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - audience: public
            suffix: storybook
          - audience: internal
            suffix: storybook-internal

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.suffix }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storybook/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SB_AUDIENCE=${{ matrix.audience }}
          # Scoped per audience. A shared scope makes the two parallel jobs overwrite
          # each other and, worse, can hand back the other build's `storybook-static`
          # layer — precisely what leaks internal stories into the public build.
          cache-from: type=gha,scope=storybook-${{ matrix.audience }}
          cache-to: type=gha,mode=max,scope=storybook-${{ matrix.audience }}

  # CD: deploy only once both images are built. `needs` both orders the jobs and
  # cancels the deploy if either app's build is red — never deploy half of the pair.
  #
  # A SKIPPED job also skips its dependents, and here that is exactly what we want: a
  # push touching only `apps/storybook` does not run `build`, so there is no new image
  # for web/admin and nothing to deploy.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Only so `docker login` on the VPS can pull the private images.
      packages: read
    # A manual run from the Actions tab can deploy too, but only from main.
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production-fe
      cancel-in-progress: false

    steps:
      - name: Pull & up on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            # REQUIRED. Without it ssh-action swallows the exit code: if `cd` hits a
            # wrong path the following commands keep running in $HOME, compose never
            # finds the file so nothing is deployed, and the job stays green because the
            # LAST command exited 0 — exactly the scenario that left the FE frozen for
            # days.
            #
            # Use `set -e` and NOT ssh-action's `script_stop` input: `script_stop`
            # injects a `$?` check after EVERY LINE, which cuts every multi-line block
            # (`if`, `for`, `case`) below in half and bash dies at parse time:
            # syntax error near unexpected token `;'.
            set -e

            cd ${{ secrets.DEPLOY_PATH }}
            # Second guard: `cd` can succeed into a correctly named but empty directory
            # (reinstalled VPS, mount not attached yet).
            test -f docker-compose.prod.yml

            # Pin the exact commit just built. This tag matches `type=sha,format=long`.
            TAG=sha-${{ github.sha }}

            # Write into `.env` rather than `export`: compose reads `FE_IMAGE_TAG` from
            # there, so a later BE deploy (`up -d`) keeps the running FE build instead of
            # swapping it back to `latest`.
            if grep -q '^FE_IMAGE_TAG=' .env; then
              sed -i "s|^FE_IMAGE_TAG=.*|FE_IMAGE_TAG=$TAG|" .env
            else
              echo "FE_IMAGE_TAG=$TAG" >> .env
            fi

            # The ghcr package is private, so `pull` needs a login. This run's token
            # expires when the job ends.
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml pull web admin
            # `up -d web admin` only: app/db/redis/nginx belong to another repo, and an
            # FE deploy must not recreate them.
            docker compose -f docker-compose.prod.yml up -d web admin

            docker logout ghcr.io

            # REQUIRED, and this is why web/admin used to swap places after every
            # deploy: `proxy_pass http://web:3000` names the host inline, with no
            # variable and no `resolver`, so nginx resolves that name ONCE at config load
            # and caches the IP forever. `up -d web admin` recreates those two containers
            # and Docker hands out new IPs, reusing the ones just freed — but nginx is
            # not in the recreate list, so it keeps sending requests to an old IP that
            # now belongs to someone else. Result: noalhub.duckdns.org serves the admin
            # app and vice versa, while the config file is perfectly correct.
            #
            # `reload` re-reads the config and therefore re-resolves every upstream name.
            # The 6-hourly `nginx -s reload` loop in compose also self-heals, but it only
            # papers over the bug hours later instead of fixing it.
            #
            # `-T` because this ssh session has no TTY. `nginx -t` first so a broken
            # config (edited by the BE repo) is caught right here instead of killing
            # nginx on reload.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            # Confirm the RUNNING containers are on the tag just built. The health check
            # in the next step only hits the domains, and a surviving old container still
            # answers 200 — it cannot tell "deployed" from "deploy did nothing".
            for svc in web admin; do
              cid=$(docker compose -f docker-compose.prod.yml ps -q "$svc")
              [ -n "$cid" ] || { echo "$svc has no running container"; exit 1; }
              img=$(docker inspect -f '{{.Config.Image}}' "$cid")
              case "$img" in
                *:"$TAG") echo "$svc → $img OK" ;;
                *) echo "$svc is running $img, expected tag $TAG"; exit 1 ;;
              esac
            done

            # Old images pile up on every deploy and a small VPS runs out of disk fast.
            # `-f` only removes images no container references.
            docker image prune -f

      - name: Post-deploy health check
        # Called from the public internet, through the same nginx/TLS path real clients
        # use — it catches cert failures as well as app failures, which an internal
        # healthcheck never sees.
        run: |
          # Wait until the URL returns the expected status code.
          #
          # `-L` is REQUIRED since i18n landed: every web route redirects once to add the
          # locale prefix (`/` → `/vi`, `/dashboard` → `/vi/dashboard`) — that is
          # `apps/web/proxy.ts`. Real clients follow the redirect, so the check must too;
          # measuring the redirect's own status measures the wrong thing, and that is
          # exactly how this step used to fail with `307 (expected 200)`.
          #
          # `--max-redirs 3`: enough for one locale hop, while a redirect loop still
          # fails (curl returns 000) instead of hanging for the full 60s.
          expect() {
            url="$1"; want="$2"
            for i in $(seq 1 10); do
              code=$(curl -sSL --max-redirs 3 -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" = "$want" ] && echo "$url → $code OK" && return 0
              echo "attempt $i: $url → $code (expected $want), retrying in 6s"
              sleep 6
            done
            echo "$url did not return $want within 60s — check the logs on the VPS"
            return 1
          }

          # Routes that must be up immediately:
          expect https://noalhub.duckdns.org/ 200
          expect https://admin-noalhub.duckdns.org/login 200

          # And that the RIGHT app sits behind each domain. Checking for 200 alone is not
          # enough: when nginx caches a stale upstream IP the two domains swap places and
          # BOTH still return 200 — a green deploy while visitors to the home page land on
          # the admin app. The two routes below exist in exactly one app each, so the
          # 200/404 pairs pin the identity down. Changing the route structure means
          # changing all four lines.
          #
          # Paths are written WITHOUT the locale prefix: `-L` takes care of that, and
          # writing `/vi/dashboard` here would mean editing this on every `localePrefix`
          # change.
          expect https://noalhub.duckdns.org/dashboard 200        # apps/web only
          expect https://noalhub.duckdns.org/overview 404         # apps/admin only
          expect https://admin-noalhub.duckdns.org/overview 200
          expect https://admin-noalhub.duckdns.org/dashboard 404

          # Finally: the locale redirect must LAND IN THE RIGHT PLACE, not merely "end in
          # a 200". `proxy.ts` failing to make it into the image is a real failure mode,
          # and when it happens `/` returns a straight 200 for a page with no locale —
          # which the `-L` above would swallow. This line is the guard for that exact case
          # (`docs/i18n.md` §3.1: `localePrefix: "always"`).
          landed=$(curl -sSL --max-redirs 3 -o /dev/null -w '%{url_effective}' https://noalhub.duckdns.org/)
          if [ "$landed" != "https://noalhub.duckdns.org/vi" ]; then
            echo "/ landed on $landed, expected https://noalhub.duckdns.org/vi — locale proxy not running?"
            exit 1
          fi
          echo "/ → $landed OK"
