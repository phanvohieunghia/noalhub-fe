name: Storybook

# Only runs when what Storybook renders actually changes. Editing apps/web or
# apps/admin cannot turn this job red, so there is no reason to make the whole
# repo wait on it.
on:
  pull_request:
    paths:
      - 'apps/storybook/**'
      - 'packages/ui/**'
      - 'packages/config/**'
      - 'packages/i18n/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/storybook.yml'
  push:
    branches: [main]
    paths:
      - 'apps/storybook/**'
      - 'packages/ui/**'
      - 'packages/config/**'
      - 'packages/i18n/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

# Back-to-back pushes to the same PR keep only the latest run — an older run no
# longer says anything about the current code.
concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Install the whole workspace: stories import @noalhub/ui, which in turn pulls
      # in @noalhub/config and @noalhub/i18n. A `--filter` here would only miss things.
      - run: pnpm install --frozen-lockfile

      # Chromium only. The test-runner defaults to exactly one browser, so downloading
      # firefox/webkit is two minutes of CI spent on nothing. `--with-deps` installs the
      # system libraries the ubuntu runner does not ship with.
      - name: Install Chromium for Playwright
        run: pnpm --filter @noalhub/storybook exec playwright install chromium --with-deps

      # `build-storybook` is a dependency of this task in turbo.json, so the static
      # build is produced first and only then does the test-runner hit it. Run against
      # the build rather than the dev server: that is exactly what gets deployed, and it
      # does not have to recompile every story during the test.
      - name: Run stories + a11y checks
        run: pnpm turbo run test-storybook:ci --filter=@noalhub/storybook

      # Keep the static build even when the tests are red — opening it is usually
      # faster than reading the axe log.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          retention-days: 7
